services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dental
      POSTGRES_PASSWORD: dental
      POSTGRES_DB: dental_ops_dev
    ports:
      - "5432:5432"
    volumes:
      - dental_ops_db_data:/var/lib/postgresql/data

volumes:
  dental_ops_db_data:
