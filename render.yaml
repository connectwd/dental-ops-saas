# Render Blueprint — Infrastructure as Code
# https://render.com/docs/blueprint-spec
#
# Deliberately does NOT define a `databases:` block. Postgres is hosted on
# Neon (free tier), not Render, to avoid Render's free Postgres 30-day
# auto-expiry/deletion. See docs/adr/0001-deployment-provider.md.

services:
  - type: web
    name: dental-ops-saas
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    # Runs once per deploy, before traffic switches to the new instance.
    # If it fails, Render halts the deploy and keeps the previous version
    # serving — this is what makes "migrate before serving" safe.
    preDeployCommand: npx prisma migrate deploy
    envVars:
      - key: NODE_ENV
        value: production
      # Auth.js needs to trust Render's proxy Host header, since Render
      # (unlike Vercel) isn't a platform Auth.js auto-detects.
      - key: AUTH_TRUST_HOST
        value: "true"
      # Both filled in manually in the Render dashboard, not generated by
      # this blueprint: DATABASE_URL comes from Neon (external to Render,
      # so there's nothing here for Render to auto-provision).
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
